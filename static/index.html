<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<title>LectureLab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='12' width='28' height='8' rx='4' fill='%2316181D'/><rect x='20' y='12' width='10' height='8' rx='4' fill='%23FFE45C'/></svg>">
<link rel="preload" href="/static/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/plex-sans-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Design direction lives in DESIGN.md: paper, ballpoint, highlighter; IBM Plex; the tape. */
@font-face { font-family: "Plex Sans"; src: url(/static/fonts/plex-sans-400.woff2) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Sans"; src: url(/static/fonts/plex-sans-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Plex Sans"; src: url(/static/fonts/plex-sans-600.woff2) format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Condensed"; src: url(/static/fonts/plex-sans-condensed-600.woff2) format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Plex Mono"; src: url(/static/fonts/plex-mono-400.woff2) format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
:root {
  color-scheme: light;
  --paper: #F7F8FA; --sheet: #FFFFFF; --ink: #16181D; --pencil: #5D6370; --ballpoint: #2747B8; --on-ballpoint: #FFFFFF;
  --highlighter: #FFE45C; --hl-line: #FFE45C; --danger: #B42318; --rule: #E3E6EC;
  --hover: color-mix(in srgb, var(--ink) 5%, transparent);
  --sans: "Plex Sans", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --cond: "Plex Condensed", "IBM Plex Sans Condensed", "Arial Narrow", "Plex Sans", sans-serif;
  --mono: "Plex Mono", "IBM Plex Mono", Consolas, ui-monospace, monospace;
  --t-xs: 13px; --t-s: 15px; --t-m: 17px; --t-l: 22px; --t-xl: 34px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  font: 400 var(--t-s)/1.5 var(--sans); color: var(--ink); background: var(--paper);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark;
    --paper: #121418; --sheet: #1A1D23; --ink: #E8EAEE; --pencil: #9AA1AE; --ballpoint: #8FA8FF; --on-ballpoint: #10142A;
    --highlighter: #E3C341; --hl-line: color-mix(in srgb, #E3C341 24%, transparent); --danger: #F97066; --rule: #2C3038; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }  /* .field etc. set display, which would otherwise beat the attribute */
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
body { margin: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; background: var(--paper); }
:focus-visible { outline: 2px solid var(--ballpoint); outline-offset: 2px; }
a { color: var(--ballpoint); text-underline-offset: 2px; }
.skip { position: absolute; left: 8px; top: 8px; z-index: 10; transform: translateY(-200%); }
.skip:focus-visible { transform: none; }

/* ---- rail */
aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--rule);
  padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.brand { font: 600 var(--t-l)/1 var(--cond); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 24px; height: 8px; border-radius: 4px; background: var(--ink); box-shadow: inset -8px 0 0 var(--highlighter); flex: none; }
.navs { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.nav-head { font-size: var(--t-xs); font-weight: 600; color: var(--pencil); margin: 16px 8px 0; }
aside nav { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
aside nav a { display: flex; align-items: baseline; gap: 8px; padding: 7px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; min-width: 0; }
aside nav a:hover { background: var(--hover); }
aside nav a[aria-current="page"] { background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink), inset 0 0 0 1px var(--rule); font-weight: 600; }
#course-nav a { flex-direction: column; gap: 0; }
#course-nav b { font: 600 var(--t-s)/1.3 var(--cond); }
#course-nav .muted { font-size: var(--t-xs); font-weight: 400; line-height: 1.35; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aside-foot { margin-top: auto; display: grid; gap: 4px; justify-items: start; font-size: var(--t-xs); }
#health { color: var(--pencil); }
#health.down { color: var(--danger); font-weight: 600; }

/* ---- page */
main { padding: 32px 48px 64px; max-width: 1040px; width: 100%; min-width: 0; outline: none; }
h2 { font: 600 var(--t-xl)/1.1 var(--cond); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h3 { font: 600 var(--t-l)/1.2 var(--cond); margin: 0; text-wrap: balance; }
.page-head { display: flex; gap: 12px 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; margin-bottom: 24px; }
.page-head > div { min-width: 0; }
.sub { margin: 8px 0 0; color: var(--pencil); display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.lede { margin: -12px 0 32px; color: var(--pencil); max-width: 68ch; }
.sec { padding: 32px 0; border-top: 1px solid var(--rule); }
.sec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.end { justify-content: flex-end; }
.muted { color: var(--pencil); }
.small { font-size: var(--t-xs); }
.code { font: 600 var(--t-s)/1.2 var(--cond); color: var(--ink); white-space: nowrap; }
.num { font: 400 var(--t-xs)/1.2 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.err { color: var(--danger); font-weight: 600; }

/* ---- controls */
button, .btn { font: 600 var(--t-s)/1.2 var(--sans); background: var(--ballpoint); color: var(--on-ballpoint); border: 1px solid transparent;
  border-radius: 8px; padding: 9px 16px; min-height: 40px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:hover:not(:disabled) { background: color-mix(in srgb, var(--ballpoint) 80%, var(--ink)); }
button:active:not(:disabled) { transform: translateY(1px); }
button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
button.ghost:hover:not(:disabled) { background: var(--sheet); border-color: var(--pencil); }
button.danger { background: transparent; color: var(--danger); border-color: var(--rule); }
button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 8%, transparent); border-color: var(--danger); }
button.danger.solid { background: var(--danger); color: var(--paper); border-color: transparent; }
button.danger.solid:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 82%, var(--ink)); }
a.btn:hover { background: color-mix(in srgb, var(--ballpoint) 80%, var(--ink)); }
a.btn:active { transform: translateY(1px); }
a.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
a.btn.ghost:hover { background: var(--sheet); border-color: var(--pencil); }
.field-error { margin: 6px 0 0; font-size: var(--t-xs); font-weight: 600; color: var(--danger); }
.drop:has([aria-invalid="true"]) { border-color: var(--danger); }
.sk { display: block; max-width: 100%; border-radius: 4px; background: var(--rule); animation: pulse 1s var(--ease-out) infinite alternate; }
@keyframes pulse { to { opacity: .45; } }
button.text { background: none; border: 0; padding: 2px 0; min-height: 0; color: var(--ballpoint); font-weight: 600; }
button.text:hover:not(:disabled) { background: none; text-decoration: underline; text-underline-offset: 2px; }
button.text.warn-text { color: var(--danger); }
button:disabled { opacity: .45; cursor: not-allowed; }
input, textarea, select { font: 400 var(--t-s)/1.4 var(--sans); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule);
  border-radius: 8px; padding: 9px 12px; width: 100%; min-width: 0; }
input:hover, textarea:hover, select:hover { border-color: var(--pencil); }
[aria-invalid="true"] { border-color: var(--danger); }
input[type="checkbox"] { width: 18px; height: 18px; padding: 0; accent-color: var(--ballpoint); flex: none; }
textarea { min-height: 200px; line-height: 1.5; resize: vertical; }
label.field { display: grid; gap: 6px; font-size: var(--t-xs); font-weight: 600; color: var(--pencil); }
.hint { margin: 0; font-size: var(--t-xs); color: var(--pencil); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px 32px; }
.form3 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }  /* title on its own row, course + date below */
.form3 > :first-child { grid-column: 1 / -1; }

/* ---- lecture list */
.list { border-top: 1px solid var(--rule); }
.lec, .lec-sk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; padding: 16px 12px; margin: 0 -12px;
  color: inherit; text-decoration: none; position: relative; border-radius: 6px; }
/* The rule sits on the text column, not under the 12px hover bleed, so it lines up with the header and list top. */
.lec::after, .lec-sk::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--rule); }
.lec:hover { background: var(--sheet); }
.lec:hover::after { opacity: 0; }
.lec .t { font-size: var(--t-m); font-weight: 600; line-height: 1.3; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lec:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.lec .d { font-size: var(--t-xs); color: var(--pencil); white-space: nowrap; padding-top: 3px; }
.lec .meta, .lec-sk .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 12px; min-width: 0; font-size: var(--t-xs); color: var(--pencil); }
.lec .meta .chip { margin-left: auto; margin-right: -6px; }
/* ---- the tape: length is the lecture's duration, texture is where its transcript is (DESIGN.md) */
.tape { display: block; flex: 1 1 120px; max-width: 320px; height: 8px; }
.tape > span { position: relative; display: block; height: 100%; width: calc(var(--len, 1) * 100%); min-width: 10px; border-radius: 4px; overflow: hidden; }
.tape[data-tape="waiting"] > span { border-radius: 0; background: repeating-linear-gradient(90deg, var(--pencil) 0 3px, transparent 3px 7px) center / 100% 2px no-repeat; }
.lec .meta .code { width: 72px; flex: none; overflow: hidden; text-overflow: ellipsis; }
.tape[data-tape="active"] > span { background: color-mix(in srgb, var(--highlighter) 30%, transparent); box-shadow: inset 0 0 0 1px var(--pencil); }
.tape[data-tape="active"] > span::after, .scrub[data-tape="active"] .scrub-track::after { content: ""; position: absolute; inset: 0;
  background: var(--highlighter); transform-origin: left; animation: sweep 2.4s var(--ease-out) infinite; }
.tape[data-tape="done"] > span { background: var(--ink); }
.tape[data-tape="error"] > span { background: var(--danger); }
.tape[data-tape="dup"] > span { box-shadow: inset 0 0 0 1px var(--pencil);
  background: repeating-linear-gradient(135deg, var(--pencil) 0 2px, transparent 2px 5px); }
.scrub-wrap { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 12px 0; margin-bottom: 8px; box-shadow: 0 1px 0 var(--rule);
  display: flex; align-items: center; gap: 16px; }
.scrub { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; border-radius: 4px; }
.scrub-track { position: absolute; left: 0; right: 0; top: 8px; height: 12px; border-radius: 3px; overflow: hidden; color: var(--ink); }
.scrub[data-tape="waiting"] .scrub-track { border: 1.5px dashed var(--pencil); }
.scrub[data-tape="active"] .scrub-track { background: color-mix(in srgb, var(--highlighter) 30%, transparent); box-shadow: inset 0 0 0 1px var(--pencil); }
.scrub[data-tape="done"] .scrub-track { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.scrub[data-tape="error"] .scrub-track { box-shadow: inset 0 0 0 1.5px var(--danger); }
.scrub[data-tape="dup"] .scrub-track { box-shadow: inset 0 0 0 1px var(--pencil);
  background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--pencil) 50%, transparent) 0 2px, transparent 2px 5px); }
.scrub-track svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .5; }
.scrub-played { position: absolute; inset: 0; background: var(--highlighter); transform-origin: left; transform: scaleX(var(--p, 0)); }
.scrub-head { position: absolute; inset: 2px 0; pointer-events: none; transform: translateX(calc(var(--p, 0) * 100%)); }
.scrub-head::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: var(--ink); }
.scrub:hover .scrub-head::before { width: 3px; left: -1.5px; }
#scrub-time { color: var(--pencil); min-width: 9ch; text-align: right; }
.keys { margin: -4px 0 16px; }
html { scroll-padding-top: 64px; }  /* the sticky tape must never cover a focused timestamp */
.chip { display: inline-block; font-size: var(--t-xs); line-height: 1.4; padding: 1px 6px; border-radius: 3px; color: var(--pencil); white-space: nowrap; }
.chip.now { background: var(--highlighter); color: #16181D; }
.chip.ok { color: var(--ink); }
.chip.bad { color: var(--danger); font-weight: 600; }
.chip.warn { color: var(--ink); box-shadow: inset 0 0 0 1px var(--pencil); }
.chip.kind { box-shadow: inset 0 0 0 1px var(--rule); }
.empty { padding: 48px 0; border-top: 1px solid var(--rule); }
.empty[data-error] { border-top: 0; padding-top: 16px; }
.empty .hint { margin: 0; }
.empty p { color: var(--pencil); max-width: 60ch; margin: 8px 0 20px; }
.inboxes { margin-top: 48px; display: grid; gap: 8px; }
.inboxes h3 { font: 600 var(--t-s)/1.3 var(--sans); }
.inbox { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
code.path { font: 400 12px/1.6 var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); background: var(--sheet); overflow-wrap: anywhere; }

/* ---- background work */
.jobs { padding: 12px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 24px; }
.jobs h3 { font: 600 var(--t-s)/1.3 var(--sans); margin-bottom: 4px; }
.job { display: flex; gap: 12px; align-items: baseline; font-size: var(--t-xs); padding: 4px 0; min-width: 0; }
.job .sweep, .job .still { align-self: center; }
.job-what { flex: none; font-weight: 600; }
.job-detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job-queue { font-size: var(--t-xs); color: var(--pencil); }
.job-queue summary { display: flex; align-items: center; gap: 12px; padding: 4px 0; cursor: pointer; list-style: none; width: fit-content; }
.job-queue summary::-webkit-details-marker { display: none; }
.job-queue summary::after { content: "Show"; content: "Show" / ""; color: var(--ink); text-decoration: underline;
  text-decoration-color: var(--rule); text-underline-offset: 3px; }
.job-queue[open] summary::after { content: "Hide"; content: "Hide" / ""; }
.job-queue summary:hover::after { text-decoration-color: currentColor; }
.job-queue ul { margin: 0 0 4px 40px; padding: 0; list-style: none; max-height: 160px; overflow: auto; font: var(--t-xs)/1.7 var(--mono); }
.still { width: 28px; height: 2px; flex: none; background: repeating-linear-gradient(90deg, var(--pencil) 0 3px, transparent 3px 7px); }
.sweep { position: relative; width: 28px; height: 6px; border-radius: 3px; overflow: hidden; flex: none;
  background: color-mix(in srgb, var(--highlighter) 35%, transparent); box-shadow: inset 0 0 0 1px var(--pencil); }
.sweep::after { content: ""; position: absolute; inset: 0; background: var(--highlighter); transform-origin: left;
  animation: sweep 1.6s var(--ease-out) infinite; }
@keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.banner { padding: 12px 16px; border-left: 3px solid var(--ink); background: var(--sheet); border-radius: 0 8px 8px 0; margin-bottom: 16px; }
.banner.bad { border-left-color: var(--danger); }

/* ---- lecture page */
.player { margin-bottom: 24px; }
video, audio { width: 100%; display: block; border-radius: 8px; }
video { max-height: 50vh; background: #000; }
#transcript { margin: 0 -8px; }
.seg, .seg-sk { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; margin: 0; padding: 4px 8px; border-radius: 4px;
  font-size: var(--t-m); line-height: 1.6; max-width: calc(68ch + 84px); }
.seg.now { background: var(--hl-line); }
.seg .ts { background: none; border: 0; padding: 3px 0 0; min-height: 0; border-radius: 3px; display: block; text-align: right; align-self: start;
  font: 400 var(--t-xs)/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--pencil); }
.seg .ts:hover:not(:disabled) { background: none; color: var(--ballpoint); text-decoration: underline; }
.source { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 4px 0; min-width: 0; }

/* ---- dialog */
dialog { border: 1px solid var(--rule); border-radius: 12px; padding: 0; width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  background: var(--sheet); color: var(--ink); overscroll-behavior: contain; box-shadow: 0 24px 64px rgba(0, 0, 0, .2); }
dialog[open] { animation: rise 180ms var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
dialog::backdrop { background: rgba(10, 12, 16, .45); }
dialog h2 { font-size: var(--t-l); }
dialog .head { padding: 24px 24px 0; } dialog .body { padding: 20px 24px; display: grid; gap: 16px; } dialog .foot { padding: 0 24px 24px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-top: 16px; }
.tabs button { background: transparent; color: var(--pencil); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; margin-bottom: -1px; }
.tabs button:hover:not(:disabled) { background: none; color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.drop { display: block; border: 1.5px dashed var(--pencil); border-radius: 10px; padding: 32px 16px; text-align: center; color: var(--pencil); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--ink); background: var(--paper); }
.drop:focus-within { outline: 2px solid var(--ballpoint); outline-offset: 2px; }
.drop strong { display: block; color: var(--ink); font-size: var(--t-m); margin-bottom: 4px; overflow-wrap: anywhere; }
.drop.has-file { border-style: solid; border-color: var(--ink); }
#cv-status { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-block: 1px solid var(--rule); }
#cv-items label { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--rule); }

/* ---- toast */
.toast { position: fixed; bottom: 24px; right: 24px; z-index: 20; background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 8px;
  max-width: min(480px, calc(100vw - 32px)); opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
.toast.show { opacity: 1; transform: none; }

@media (pointer: coarse) {
  button, aside nav a, .tabs button { min-height: 44px; }
  .seg .ts { min-height: 0; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; }
}
@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; overflow: visible; flex-direction: row; flex-wrap: wrap; align-items: center;
    padding: 12px 16px 0; gap: 12px; border-right: 0; border-bottom: 1px solid var(--rule); }
  .brand { flex: 1; margin: 0; }
  .navs { flex-basis: 100%; flex-direction: row; gap: 4px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
  .nav-head { display: none; }
  aside nav { flex-direction: row; gap: 4px; flex: none; }
  aside nav a, #course-nav a { flex: none; flex-direction: row; white-space: nowrap; align-items: center; min-height: 44px; padding: 8px 10px; border-radius: 0; }
  aside nav a[aria-current="page"] { background: none; box-shadow: inset 0 -2px 0 var(--ink); }
  #course-nav .muted { display: none; }
  .aside-foot { flex-basis: 100%; margin: 0 0 8px; }
  .aside-foot:not(:has(#health.down, #canvas-badge:not([hidden]))) { display: none; }
  main { padding: 24px 16px 48px; }
  h2 { font-size: 28px; }
  .lec { gap: 4px 12px; }
  .lec .meta { flex-wrap: wrap; }
  .job-rows .job { flex-wrap: wrap; row-gap: 0; }
  .job-rows .job-detail { flex-basis: 100%; padding-left: 40px; white-space: normal; overflow-wrap: anywhere; }
  .lec .tape { order: -1; flex-basis: 100%; max-width: none; margin: 4px 0 2px; }
}
@media (max-width: 480px) { .form3 { grid-template-columns: 1fr; } }
@media (pointer: coarse) { button.text, .job-queue summary { min-height: 44px; } }
</style>
</head>
<body>
<button class="skip" id="skip" type="button">Skip to content</button>
<aside>
  <h1 class="brand" translate="no"><span class="brand-mark" aria-hidden="true"></span>LectureLab</h1>
  <button id="add-btn" type="button" aria-keyshortcuts="A" title="Add recording (A)">Add recording</button>
  <div class="navs">
    <nav id="nav" aria-label="Main">
      <a href="#/" data-route="library">Library</a>
      <a href="#/courses" data-route="courses">Courses &amp; vocabulary</a>
    </nav>
    <div class="nav-head" id="courses-head">Courses</div>
    <nav id="course-nav" aria-labelledby="courses-head"></nav>
  </div>
  <div class="aside-foot">
    <button type="button" class="text warn-text" id="canvas-badge" hidden>Canvas needs sign-in</button>
    <div id="health">Connecting…</div>
  </div>
</aside>
<main id="view" tabindex="-1"></main>

<dialog id="add-dlg" aria-labelledby="add-title-h">
  <form method="dialog" id="add-form" novalidate>
    <div class="head"><h2 id="add-title-h">Add recording</h2>
      <div class="tabs" role="tablist" aria-label="Where the recording comes from">
        <button type="button" role="tab" id="tab-file" aria-controls="pane-file" aria-selected="true" data-tab="file" class="on">File</button>
        <button type="button" role="tab" id="tab-link" aria-controls="pane-link" aria-selected="false" tabindex="-1" data-tab="link">Link</button>
        <button type="button" role="tab" id="tab-canvas" aria-controls="pane-canvas" aria-selected="false" tabindex="-1" data-tab="canvas">Canvas</button>
      </div>
    </div>
    <div class="body">
      <div data-pane="file" role="tabpanel" id="pane-file" aria-labelledby="tab-file">
        <label class="drop" id="drop">
          <input type="file" id="add-file" accept=".mp4,.mov,.mkv,.webm,.m4a,.mp3,.wav" class="vh">
          <span id="drop-label"><strong>Drop a recording here</strong>or click to choose a file<br><span class="small">mp4, mov, mkv, webm, m4a, mp3, wav</span></span>
        </label>
      </div>
      <div data-pane="link" role="tabpanel" id="pane-link" aria-labelledby="tab-link" hidden>
        <label class="field">Link (Zoom, Google Drive, YouTube, Panopto, Mediasite, Kaltura…)
          <input id="add-url" type="url" name="url" autocomplete="off" spellcheck="false" placeholder="https://ufl.zoom.us/rec/share/…"></label>
        <label class="field" id="passcode-field" hidden>Zoom passcode (if the recording has one)
          <input id="add-passcode" name="passcode" autocomplete="off" spellcheck="false"></label>
      </div>
      <div data-pane="canvas" role="tabpanel" id="pane-canvas" aria-labelledby="tab-canvas" hidden>
        <div id="cv-status"></div>
        <div class="row spread"><span class="hint">Choose a course above, then scan its Canvas Files, Modules, Pages and Announcements for recordings.</span>
          <button type="button" class="ghost" id="cv-scan">Scan Canvas</button></div>
        <label class="row small" style="gap:8px"><input type="checkbox" id="cv-auto"> Auto-pull new recordings for this course on every sync</label>
        <div id="cv-items" class="small" style="max-height:260px;overflow:auto"></div>
      </div>
      <div id="add-meta" style="display:grid;gap:8px">
        <div class="form3">
          <label class="field">Title <input id="add-title" name="title" autocomplete="off" placeholder="From the recording…"></label>
          <label class="field">Course <select id="add-course" name="course"></select></label>
          <label class="field">Date <input id="add-date" name="date" type="date"></label>
        </div>
        <p class="hint">Title and date are optional: they come from the source’s metadata when it has them.</p>
      </div>
    </div>
    <div class="foot row spread">
      <button type="button" class="ghost" id="add-cancel">Cancel</button>
      <button type="submit" id="add-submit">Add recording</button>
    </div>
  </form>
</dialog>
<dialog id="confirm-dlg" aria-labelledby="confirm-h" style="width:min(440px, calc(100vw - 32px))">
  <form method="dialog">
    <div class="head"><h2 id="confirm-h"></h2></div>
    <div class="body"><p id="confirm-msg" class="muted" style="margin:0"></p></div>
    <div class="foot row end"><button value="cancel" class="ghost" autofocus>Cancel</button><button value="ok" class="danger solid" id="confirm-ok"></button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { courses: [], lectures: [], jobs: [] };

async function api(path, opts = {}) {
  const json = opts.body && typeof opts.body !== "string" && !(opts.body instanceof FormData);
  const res = await fetch(path, { ...opts, headers: json ? { "Content-Type": "application/json" } : {},
    body: json ? JSON.stringify(opts.body) : opts.body });
  if (!res.ok) {
    const text = await res.text();
    let msg = text || res.statusText;
    try { const d = JSON.parse(text).detail; msg = typeof d === "string" ? d : JSON.stringify(d); } catch {}
    throw Object.assign(new Error(msg), { status: res.status });
  }
  return res.headers.get("content-type")?.includes("json") ? res.json() : res.text();
}
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms); }
const fmtDur = s => { if (!s) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(s % 60).padStart(2, "0")}s`; };
// Lecture dates are plain YYYY-MM-DD (local); source timestamps are SQLite UTC "YYYY-MM-DD HH:MM:SS".
const fmtDate = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number);
  return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", ...(y !== new Date().getFullYear() && { year: "numeric" }) })
    .format(new Date(y, m - 1, d)); };
const utc = s => Date.parse(s.replace(" ", "T") + "Z");
const fmtWhen = s => s ? new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(utc(s)) : "";
const STATUS = { queued_transcribe: ["waiting to transcribe", ""], transcribing: ["transcribing", "now"],
  transcribed: ["transcribed", "ok"], aligned: ["aligned", "ok"], notes_queued: ["notes queued", ""],
  notes_running: ["writing notes", "now"], notes_done: ["notes ready", "ok"], exported: ["exported", "ok"],
  duplicate: ["possible duplicate", "warn"], error: ["error", "bad"], waiting_quota: ["waiting for plan limit", "warn"] };
const chip = st => { const [label, cls] = STATUS[st] || [st, ""]; return `<span class="chip ${cls}" data-status="${esc(st)}">${esc(label)}</span>`; };
const courseOptions = (sel, blank = "No course") => `<option value="">${blank}</option>` +
  state.courses.map(c => `<option value="${c.id}" ${c.id == sel ? "selected" : ""}>${esc(c.code)} · ${esc(c.name)}</option>`).join("");

async function loadCourses() {
  state.courses = await api("/api/courses");
  $("#course-nav").innerHTML = state.courses.map(c =>
    `<a href="#/course/${c.id}" data-route="course-${c.id}" title="${esc(c.name)}"><b translate="no">${esc(c.code)}</b> <span class="muted">${esc(c.name)}</span></a>`).join("");
}
async function loadLectures() { state.lectures = await api("/api/lectures"); }

// Where the transcript is, as a tape texture. Everything after "transcribed" has one.
const tapeState = st => st === "queued_transcribe" ? "waiting" : st === "transcribing" ? "active"
  : st === "error" ? "error" : st === "duplicate" ? "dup" : "done";

function lectureList(lectures, course = null, inboxes = []) {
  if (!lectures.length) {
    const folders = inboxes.map(i => `<div class="inbox"><code class="path">${esc(i.path)}\\${course ? esc(course.code) : "&lt;COURSE&gt;"}\\</code>
      <span class="small muted">${i.kind === "drive" ? "Google Drive" : "This laptop"}</span></div>`).join("");
    return `<div class="empty"><h3>${course ? `No ${esc(course.code)} lectures yet` : "Your library is empty"}</h3>
      <p>Add a recording from a file, a link or Canvas. Transcripts and notes are made from it in the background.</p>
      <button type="button" data-action="add">Add recording</button>
      ${folders ? `<div class="inboxes" style="margin-top:32px"><p class="hint">Or drop a file into an inbox folder:</p>${folders}</div>` : ""}</div>`;
  }
  const longest = Math.max(...lectures.map(l => l.duration_sec || 0)) || 1;
  return `<div class="list">${lectures.map(l => `
    <a class="lec" href="#/lecture/${l.id}" data-lecture="${l.id}">
      <span class="t">${esc(l.title)}</span>
      <span class="d">${esc(fmtDate(l.date))}</span>
      <span class="meta"><span class="code" translate="no">${esc(l.course_code || "No course")}</span>
        <span class="tape" data-tape="${tapeState(l.status)}" style="--len:${Math.max((l.duration_sec || 0) / longest, .04).toFixed(3)}" aria-hidden="true"><span></span></span>
        <span class="num">${l.duration_sec ? fmtTs(l.duration_sec) : ""}</span>${l.has_video ? "<span>video</span>" : ""}
        ${chip(l.status)}</span>
    </a>`).join("")}</div>`;
}

const termCount = v => { const n = (v || "").split("\n").filter(t => t.trim()).length;
  return n ? `${n} ${n === 1 ? "term" : "terms"}` : "No terms yet"; };
const jobKind = k => k.charAt(0).toUpperCase() + k.slice(1);
const JOB_VERB = { ingest: "Adding a recording", canvas_pull: "Pulling from Canvas", canvas_scan: "Scanning Canvas",
  transcribe: "Transcribing" };
const JOB_WAIT = { ingest: "waiting to be added", canvas_pull: "waiting to be pulled from Canvas",
  canvas_scan: "Canvas scans waiting", transcribe: "waiting to transcribe" };
const OPAQUE = /^[a-z]+:[\w-]{16,}$/;
const jobVerb = k => JOB_VERB[k] || jobKind(k.replace(/_/g, " "));
// Running jobs get a row each; queued ones collapse to one line per kind, so a 26-file pull doesn't bury the Library.
function jobsPanel() {
  if (!state.jobs.length) return "";
  const open = new Set($$("#jobs details[open]").map(d => d.dataset.kind));  // survive the 1.5 s refresh
  const running = state.jobs.filter(j => j.status !== "queued"), queued = {};
  state.jobs.filter(j => j.status === "queued").forEach(j => (queued[j.kind] ||= []).push(j));
  return `<section class="jobs" id="jobs" aria-label="Background work"><h3>Working on</h3><div class="job-rows">${running.map(j => `
    <div class="job" data-job="${esc(j.id)}"><span class="sweep" aria-hidden="true"></span><span class="job-what">${esc(jobVerb(j.kind))}</span>
    <span class="muted job-detail" ${OPAQUE.test(j.label || "") ? "" : `title="${esc(j.label)}"`}>${esc(j.progress || (OPAQUE.test(j.label || "") ? "starting…" : j.label))}</span></div>`).join("")}</div>${
    Object.entries(queued).map(([k, js]) => {
      const line = `<span class="still" aria-hidden="true"></span><span class="n">${js.length} more ${esc(JOB_WAIT[k] || `waiting: ${jobVerb(k)}`)}</span>`;
      // Queued Canvas pulls only know an opaque file id ("drive:1Cjx…"); a list of those helps nobody, so no Show.
      if (js.every(j => OPAQUE.test(j.label || ""))) return `<div class="job-queue job" data-kind="${esc(k)}">${line}</div>`;
      return `<details class="job-queue" data-kind="${esc(k)}" ${open.has(k) ? "open" : ""}><summary>${line}</summary>
    <ul>${js.map(j => `<li data-job="${esc(j.id)}" class="muted">${esc(j.label)}</li>`).join("")}</ul></details>`; }).join("")}</section>`;
}

// One transcription at a time: a second click would open a second Colab session. A batch row with no
// ended_at is still running (the CLI's batches don't show up as server jobs); after 4 h assume it crashed.
const transcribeRunning = ts => state.jobs.some(j => j.kind === "transcribe")
  || ts.batches.some(b => !b.ended_at && Date.now() - utc(b.started_at) < 4 * 3600e3);

function colabLine(ts, running) {
  if (!ts.colab_enabled) return "Colab off: transcribing on this laptop’s CPU";
  if (ts.colab_failures >= 2) return `<span class="err">Colab failed twice, so the laptop CPU is used until it works again</span>`;
  const last = ts.batches.find(b => b.mode === "colab");
  if (running) return "Transcription batch running";
  if (!last) return "Colab GPU (no batches yet)";
  const units = last.units_after != null ? `, ${last.units_after} units left` : "";
  if (last.ok) return `Last Colab batch finished on ${esc(last.gpu || "?")}${units}`;
  const why = last.error || "no error recorded";
  return `<span class="err" title="${esc(why)}">Last Colab batch failed: ${esc(why.length > 70 ? why.slice(0, 70) + "…" : why)}</span>`;
}

const views = {
  async library() {
    await loadLectures();
    const [inboxes, ts, jobs] = await Promise.all([api("/api/inboxes"), api("/api/transcribe/status"), api("/api/jobs")]);
    state.jobs = jobs;
    const running = transcribeRunning(ts);
    return `<div class="page-head"><h2>Library</h2><div class="row">
        <span class="small muted" id="colab-line">${colabLine(ts, running)}</span>
        <button id="tr-queued" ${ts.queued && !running ? "" : "disabled"}>${running ? "Transcribing…"
          : ts.queued ? `Transcribe ${ts.queued} waiting` : "Nothing waiting to transcribe"}</button></div></div>
      ${jobsPanel()}${lectureList(state.lectures, null, inboxes)}
      <section class="inboxes"><h3>Inbox folders</h3>
        <p class="hint">Drop a file into the course’s subfolder and it’s picked up within a minute.</p>
        ${inboxes.map(i => `<div class="inbox"><code class="path">${esc(i.path)}\\&lt;COURSE&gt;\\</code>
          <span class="small muted">${i.kind === "drive" ? "Google Drive" : "This laptop"}</span></div>`).join("")}</section>`;
  },
  async courses() {
    if (!state.courses.length) return `<div class="page-head"><h2>Courses &amp; vocabulary</h2></div>
      <div class="empty"><h3>No courses found</h3><p>The server creates your courses the first time it starts.
        Check server.log for a database error, then restart it with <code>lecturelab serve</code>.</p>
        <button type="button" data-retry>Try again</button></div>`;
    return `<div class="page-head"><h2>Courses &amp; vocabulary</h2></div>
      <p class="lede">One term per line: names, jargon, function names. These are fed to Whisper and to the note prompts so technical terms come out right.</p>
      <div class="grid2">${state.courses.map(c => `
        <section data-course="${c.id}" style="display:grid;gap:12px">
          <div class="row" style="flex-wrap:nowrap"><span class="code" style="font-size:var(--t-l)">${esc(c.code)}</span>
            <input class="course-name" name="course-name" autocomplete="off" value="${esc(c.name)}" aria-label="Course name"></div>
          <textarea class="course-vocab" spellcheck="false" aria-label="${esc(c.code)} vocabulary"
            placeholder="One term per line, for example:&#10;Dijkstra&#10;B-tree&#10;malloc">${esc(c.vocabulary)}</textarea>
          <div class="row spread">
            <span class="small muted term-count">${termCount(c.vocabulary)}</span>
            <button class="save-course ghost">Save vocabulary</button></div>
        </section>`).join("")}</div>`;
  },
  async course(id) {
    const c = state.courses.find(c => c.id == id);
    if (!c) throw Object.assign(new Error("course not found"), { status: 404 });
    const [, inboxes] = await Promise.all([loadLectures(), api("/api/inboxes")]);
    return `<div class="page-head"><div><h2>${esc(c.name)}</h2><p class="sub"><span class="code">${esc(c.code)}</span></p></div></div>
      ${jobsPanel()}${lectureList(state.lectures.filter(l => l.course_id == id), c, inboxes)}`;
  },
  async lecture(id) {
    const l = await api(`/api/lectures/${id}`);
    const media = l.video_path
      ? `<video id="player" controls preload="metadata" src="/api/lectures/${l.id}/media/video"></video>`
      : `<audio id="player" controls preload="metadata" src="/api/lectures/${l.id}/media/audio"></audio>`;
    const dup = l.status === "duplicate" ? `<div class="banner" id="dup-banner">
        This looks like the same recording as <a href="#/lecture/${l.dup_of}">lecture ${l.dup_of}</a>, so it won’t be processed.
        <div class="row" style="margin-top:12px"><button id="not-dup">Not a duplicate</button>
        <button class="danger" id="del-dup">Delete this copy</button></div></div>` : "";
    const err = l.status === "error" ? `<div class="banner bad"><b>Error:</b> ${esc(l.error)}</div>` : "";
    const [segs, ts, jobs] = await Promise.all([l.segment_count ? api(`/api/lectures/${l.id}/segments`) : [],
      api("/api/transcribe/status"), api("/api/jobs")]);
    state.jobs = jobs;
    const busy = transcribeRunning(ts) ? "disabled" : "";
    const canTranscribe = l.status !== "transcribing"
      && (["queued_transcribe", "error"].includes(l.status) || l.transcript_source === "v1");
    const tbtns = canTranscribe ? `${busy ? `<span class="small muted">A transcription batch is running; these unlock when it finishes.</span>` : ""}
        <button id="tr-auto" ${busy}>Transcribe (Colab GPU)</button>
        <button class="ghost" id="tr-local" ${busy}>Transcribe locally</button>` : "";
    const srcNote = l.transcript_source === "v1" ? "Old v1 transcript (Whisper base): a large-v3 transcript replaces it once transcribed"
      : l.transcript_source ? `by ${esc(l.transcript_source)}` : "";
    const course = state.courses.find(c => c.id == l.course_id);
    return `<div class="page-head"><div><h2 id="lec-title">${esc(l.title)}</h2>
        <p class="sub">${course ? `<span class="code">${esc(course.code)}</span>` : ""}<span>${esc(fmtDate(l.date))}</span>
          <span class="num">${l.duration_sec ? fmtTs(l.duration_sec) : ""}</span></p></div>${chip(l.status)}</div>${dup}${err}
      <div class="player">${media}</div>
      ${scrubber(l, segs)}
      <p class="hint keys">Keys: K plays or pauses, J and L skip 10 seconds. Click the tape or a timestamp to jump there.</p>
      <section class="sec" id="transcript-card"><div class="sec-head"><div><h3>Transcript</h3>
        <p class="hint" id="tr-source" style="margin-top:4px">${srcNote}</p></div><div class="row">${tbtns}</div></div>
        ${segs.length ? `<div id="transcript">${segs.map(s => `<p class="seg" data-start="${s.start}" data-end="${s.end}"><button type="button"
          class="ts" data-seek="${s.start}" aria-label="Play from ${fmtTs(s.start)}">${fmtTs(s.start)}</button><span>${esc(s.text)}</span></p>`).join("")}</div>`
          : `<p class="muted" id="no-transcript">${l.status === "transcribing" ? "Transcribing now. The text appears here when the batch finishes."
            : canTranscribe ? "Not transcribed yet. Transcribe it on a Colab GPU (fast) or on this laptop (slow, works offline)."
            : "Not transcribed yet."}</p>`}</section>
      <section class="sec" id="lec-meta"><div class="sec-head"><h3>Details</h3></div><div class="form3">
        <label class="field">Title <input id="m-title" name="title" autocomplete="off" value="${esc(l.title)}"></label>
        <label class="field">Course <select id="m-course" name="course">${courseOptions(l.course_id)}</select></label>
        <label class="field">Date <input id="m-date" name="date" type="date" value="${esc(l.date || "")}"></label></div>
        <div class="row spread" style="margin-top:16px"><span class="small muted">${fmtDur(l.duration_sec)}, ${l.video_path ? "video and audio" : "audio only"}</span>
        <button id="m-save">Save details</button></div></section>
      <section class="sec"><div class="sec-head"><h3>Sources</h3></div>${l.sources.map(s => `<div class="source small" data-source="${esc(s.kind)}"><span class="chip kind">${esc(s.kind)}</span>
        <code class="path">${esc(s.url)}</code> <span class="muted">${esc(fmtWhen(s.added_at))}</span></div>`).join("")}</section>
      <div class="row end sec"><button class="danger" id="del-lec">Delete lecture</button></div>`;
  },
};

const binders = {
  library() {
    $("#tr-queued").onclick = async () => {
      const r = await api("/api/transcribe", { method: "POST", body: { mode: "auto" } });
      toast(r.note || "Transcribing everything waiting in one Colab batch…");
      watchJob(r.job_id, true).then(j => { if (j.status === "done") toast(`Transcribed ${j.result.transcribed.length} lecture(s) (${j.result.mode})`, 6000); render(); });
      render();
    };
  },
  courses() {
    $$(".save-course").forEach(btn => btn.onclick = async () => {
      const card = btn.closest("[data-course]");
      const saved = await api(`/api/courses/${card.dataset.course}`, { method: "PUT",
        body: { name: $(".course-name", card).value, vocabulary: $(".course-vocab", card).value } });
      // Update just this card so unsaved edits in the other cards survive.
      $(".course-vocab", card).value = saved.vocabulary;
      $(".course-name", card).value = saved.name;
      $(".term-count", card).textContent = termCount(saved.vocabulary);
      dirty.delete(`course-${card.dataset.course}`); btn.classList.add("ghost");
      await loadCourses();
      toast("Saved");
    });
  },
  lecture(id) {
    $("#m-save").onclick = async () => {
      const l = await api(`/api/lectures/${id}`, { method: "PATCH", body: {
        title: $("#m-title").value, date: $("#m-date").value || null, course_id: $("#m-course").value ? +$("#m-course").value : null } });
      $("#lec-title").textContent = l.title;
      dirty.delete("meta");
      toast("Saved");
    };
    const del = async () => {
      if (!await confirmDanger("Delete this lecture?",
        "This removes the lecture, its transcript and its files from LectureLab. It can’t be undone.", "Delete lecture")) return;
      await api(`/api/lectures/${id}`, { method: "DELETE" }); dirty.clear(); toast("Lecture deleted"); location.hash = "#/"; };
    $("#del-lec").onclick = del;
    if ($("#del-dup")) $("#del-dup").onclick = del;
    if ($("#not-dup")) $("#not-dup").onclick = async () => { await api(`/api/lectures/${id}/not-duplicate`, { method: "POST" }); render(); };
    const v = $("video#player");
    if (v) v.onerror = () => { // e.g. an .mkv the browser can't decode: fall back to the normalized audio
      v.outerHTML = `<audio id="player" controls preload="metadata" src="/api/lectures/${id}/media/audio"></audio>`; bindPlayer(); };
    const startTranscribe = mode => async () => {
      const { job_id } = await api("/api/transcribe", { method: "POST", body: { lecture_ids: [+id], mode } });
      toast(mode === "local" ? "Transcribing on this laptop’s CPU…" : "Sending to a Colab GPU…");
      render();
      const j = await watchJob(job_id, true);
      if (j.status === "done") { toast(`Transcribed (${j.result.mode}${j.result.reason ? ": " + j.result.reason : ""})`, 6000); }
      if (location.hash === `#/lecture/${id}`) render();
    };
    if ($("#tr-auto")) $("#tr-auto").onclick = startTranscribe("auto");
    if ($("#tr-local")) $("#tr-local").onclick = startTranscribe("local");
    $$("[data-seek]").forEach(a => a.onclick = e => { e.preventDefault(); seek(+a.dataset.seek); });
    bindPlayer();
  },
};

// ---- player <-> transcript

function scrubber(l, segs) {

  if (!dur) return "";
  const ticks = segs.map(s => `<rect x="${(s.start / dur * 1000).toFixed(1)}" y="0" height="12"
    width="${Math.max((s.end - s.start) / dur * 1000, .8).toFixed(1)}"/>`).join("");
  return `<div class="scrub-wrap"><div class="scrub" id="scrub" data-tape="${tapeState(l.status)}" data-dur="${dur}" role="slider" tabindex="0"
      aria-label="Seek" aria-valuemin="0" aria-valuemax="${Math.round(dur)}" aria-valuenow="0" aria-valuetext="0:00 of ${fmtTs(dur)}">
      <div class="scrub-track"><span class="scrub-played"></span>
        ${ticks ? `<svg viewBox="0 0 1000 12" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${ticks}</svg>` : ""}</div><span class="scrub-head"></span></div>

  const dur = () => p.duration && isFinite(p.duration) ? p.duration : +sc.dataset.dur;
  const show = t => { const d = dur(), f = Math.min(Math.max(t / d, 0), 1);
    sc.style.setProperty("--p", f); sc.setAttribute("aria-valuenow", Math.round(t));
    sc.setAttribute("aria-valuetext", `${fmtTs(t)} of ${fmtTs(d)}`); $("#scrub-time").textContent = `${fmtTs(t)} / ${fmtTs(d)}`; };

let renderSeq = 0, shown = "";

// ---- background job polling
// Update the panel in place: swapping it wholesale every 1.5 s ate clicks on "Show" and dropped keyboard focus.
function patchJobs(panel) {
  const next = document.createRange().createContextualFragment(jobsPanel()).firstElementChild;
  const kinds = el => $$(".job-queue", el).map(d => d.tagName + d.dataset.kind).join();
  if (kinds(panel) !== kinds(next)) return panel.replaceWith(next);  // a whole queue appeared or emptied
  const sync = (a, b) => { if (a && b && a.innerHTML !== b.innerHTML) a.innerHTML = b.innerHTML; };
  sync($(".job-rows", panel), $(".job-rows", next));
  $$(".job-queue", next).forEach(d => {
    const cur = $(`.job-queue[data-kind="${CSS.escape(d.dataset.kind)}"]`, panel);
    sync($(".n", cur), $(".n", d)); sync($("ul", cur), $("ul", d));
  });
}
async function pollJobs() {
  try {
    const before = state.jobs.length;
    state.jobs = await api("/api/jobs");
    const onList = /^(#\/?)?$|^#\/course\//.test(location.hash);
    if (onList && (before || state.jobs.length)) {
      const panel = $("#jobs");
      if (state.jobs.length && panel) patchJobs(panel);
      else render();
    }
  } catch {}  // server restarting: the heartbeat says so; keep polling
  setTimeout(pollJobs, state.jobs.length ? 1500 : 5000);
}
async function watchJob(id, quiet = false) {
  for (;;) {
    await new Promise(r => setTimeout(r, 1500));
    const j = await api(`/api/jobs/${id}`);
    if (quiet && ["done", "error"].includes(j.status)) {
      if (j.status === "error") toast(`Failed: ${j.error}`, 12000);
      return j;
    }
    if (j.status === "done") {
      const r = j.result.lectures[0];
      if (/^(#\/?)?$|^#\/course\//.test(location.hash)) await render();  // show the new lecture
      toast(r.parked_dup_of ? `Possible duplicate of lecture ${r.parked_dup_of} (${r.how}); parked as lecture ${r.lecture_id}`
        : r.duplicate ? `Already in your library (${r.how}): lecture ${r.lecture_id}` : `Ready: lecture ${r.lecture_id}`, 6000);
      return j;
    }
    if (j.status === "error") { toast(`Failed: ${j.error}`, 12000); return j; }
  }
}

async function heartbeat() {
  const h$ = $("#health");
  try { const h = await api("/api/health"); h$.textContent = `Server ok, v${h.version}`; h$.classList.remove("down"); await loadCanvasStatus();
    // A batch started from the CLI isn't a server job, so nothing else re-renders when it finishes: re-check here,
    // and only re-render once it's over and nothing is playing (a re-render rebuilds the player).
    if ($("#tr-queued")?.textContent === "Transcribing…" || $("#tr-auto")?.disabled) {
      const [ts, jobs] = await Promise.all([api("/api/transcribe/status"), api("/api/jobs")]);
      state.jobs = jobs;

    } }

}
