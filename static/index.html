<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LectureLab</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-head">
      <h1>🎓 LectureLab</h1>
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">🌙</button>
    </div>
    <div class="search-wrap">
      <input id="search-input" type="search" placeholder="Search transcripts &amp; notes…" autocomplete="off">
    </div>
    <div id="course-list"></div>
    <button id="add-course-btn" class="btn ghost full">+ New course</button>
  </aside>

  <main id="main">
    <div id="banner" class="banner hidden"></div>
    <div id="content"></div>
  </main>
</div>

<div id="modal-root" class="hidden">
  <div class="modal-backdrop"></div>
  <div class="modal" role="dialog">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost">Cancel</button>
      <button id="modal-ok" class="btn primary">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
